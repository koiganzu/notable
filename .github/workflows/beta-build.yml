name: Beta build
# Builds an installable test APK on every push to the beta branch and
# publishes it as the latest release, so the newest build is always at
# /releases/latest and can be downloaded on the tablet without signing in.
on:
  push:
    branches: ["beta"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        env:
          # Throwaway test key kept in the repo so every build has the same
          # signature and installs over the previous one. Never use it for a
          # real release.
          STORE_FILE: ${{ github.workspace }}/ci/beta-debug.keystore
          STORE_PASSWORD: android
          KEY_ALIAS: beta
          KEY_PASSWORD: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      # A failed build leaves its errors on the ci-logs branch, where they can be read with git.
      - name: Save build errors
        if: failure()
        run: |
          {
            echo "Run ${{ github.run_number }} for ${{ github.sha }}"
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by" build.log || true
            echo "---- last 120 lines ----"
            tail -n 120 build.log
          } > /tmp/errors.txt
          git config user.name "beta-build"
          git config user.email "beta-build@users.noreply.github.com"
          git checkout -q --orphan ci-logs-tmp
          git rm -rfq --cached .
          cp /tmp/errors.txt errors.txt
          git add -f errors.txt
          git commit -qm "Build errors for run ${{ github.run_number }}"
          git push -f origin HEAD:refs/heads/ci-logs

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="beta-${{ github.run_number }}"
          APK="boox-mods-${TAG}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Beta build ${{ github.run_number }}" \
            --notes "Test build from commit ${{ github.sha }}."

      # Room writes the new database schema during the build. Commit it back: later schema
      # changes are generated by comparing against it.
      - name: Commit generated database schema
        run: |
          git add app/schemas
          if ! git diff --cached --quiet; then
            git config user.name "beta-build"
            git config user.email "beta-build@users.noreply.github.com"
            git commit -qm "Add generated database schema [skip ci]"
            git push origin HEAD:refs/heads/beta
          fi
